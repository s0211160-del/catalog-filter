name: Auto Run Catalog Filter

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 執行過濾程式
        run: python main.py

      - name: 自動提交並推送生成的 CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.csv .nojekyll || true
          git commit -m "Auto update catalog.csv" || exit 0
          git push origin main
